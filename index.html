<!doctype html>
<html lang="tr">
<head>

<div class="center-logo">
 <img src="logo_preview.png" alt="Logo" style="width:180px; height:auto; display:block; margin:0 auto;">

</header>
   
    <section class="display-grid">

      <article class="info-card">

          <li class="empty">Bilgiler yükleniyor...</li>

    <footer class="display-footer">

  <span id="clock"></span>
</footer>

  <script type="module" src="display.js"></script>
